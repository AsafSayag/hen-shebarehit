<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>החן שברהיט – ייצוא לוגו</title>
<!-- Renders the lamp logo for export to PNG. Open with #light, #dark, #square or #mark-only; see README. -->
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  body { font-family: "Assistant", sans-serif; }
  .stage { display: inline-flex; padding: 40px; }
  .logo { --size: 120px; display: inline-flex; align-items: center; gap: calc(var(--size) * .5); line-height: 1; white-space: nowrap; }
  .logo.stacked { flex-direction: column; gap: calc(var(--size) * .3); }
  .mark { width: calc(var(--size) * 1.6); height: auto; }
  .stacked .mark { width: calc(var(--size) * 2.2); }
  .words { display: flex; flex-direction: column; align-items: center; }
  .name { font-size: var(--size); letter-spacing: -.01em; }
  .first { font-weight: 700; }
  .second { font-weight: 300; }
  .tagline { margin-top: calc(var(--size) * .2); font-size: calc(var(--size) * .36); letter-spacing: .04em; }
  .light .first { color: #333530; } .light .second, .light .tagline { color: #8a755a; }
  .dark .first { color: #f6f2eb; } .dark .second, .dark .tagline { color: #c9b79c; }
  .square { width: 1080px; height: 1080px; display: grid; place-items: center; background: #f6f2eb; padding: 0; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const mark = (ink, warm) => `<svg class="mark" viewBox="0 0 64 72" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M32 2v15" stroke="${warm}" stroke-width="1.8"/>
  <path d="M17 33c0-9.4 6.7-16 15-16s15 6.6 15 16z" fill="${warm}"/>
  <circle cx="32" cy="36.5" r="2.6" fill="${warm}"/>
  <path d="M24 42.5q8 4.5 16 0" stroke="${warm}" stroke-width="1.6"/>
  <path d="M17 59v-3.5a3 3 0 0 1 3-3h24a3 3 0 0 1 3 3V59" stroke="${ink}" stroke-width="2.4"/>
  <path d="M12 68v-7.5a3 3 0 0 1 6 0V63h28v-2.5a3 3 0 0 1 6 0V68z" stroke="${ink}" stroke-width="2.4"/>
</svg>`;
const words = `<span class="words"><span class="name"><span class="first">החן</span> <span class="second">שברהיט</span></span><span class="tagline">כשנוחות ויופי נפגשים</span></span>`;
const variant = location.hash.slice(1) || 'light';
const stage = document.getElementById('stage');
if (variant === 'dark') stage.innerHTML = `<span class="logo dark">${mark('#f6f2eb', '#c9b79c')}${words}</span>`;
else if (variant === 'square') { stage.className = 'stage square'; stage.innerHTML = `<span class="logo light stacked" style="--size:120px">${mark('#333530', '#8a755a')}${words}</span>`; }
else if (variant === 'mark-only') stage.innerHTML = `<span class="logo light" style="--size:200px">${mark('#333530', '#8a755a')}</span>`;
else stage.innerHTML = `<span class="logo light">${mark('#333530', '#8a755a')}${words}</span>`;
</script>
</body>
</html>
